<!DOCTYPE html>
<html lang="ceb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}{{ club.name }} — On-Demand Island Express Riders{% endblock %}</title>
  <meta name="description" content="Pahatud, Pakuha, Pasugo, Pabili sa Camiguin Island — Camiguin Centric Riders Club.">
  <meta name="theme-color" content="#f97316">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CentricRiders">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/icons/icon-192.png">

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css?v=1">
  {% block head %}{% endblock %}
</head>
<body class="app-body">
  <div id="offline-banner" class="offline-banner hidden" role="status">
    <span>⚠️ Offline mode — walay internet connection.</span>
  </div>

  <!-- Header Navigation -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-link" aria-label="{{ club.name }} Home">
        <div class="brand-logo-wrap">
          <span class="brand-logo-emoji">🛵</span>
        </div>
        <div class="brand-text">
          <span class="brand-name">{{ club.name }}</span>
          <span class="brand-sub">Camiguin Island On-Demand Express</span>
        </div>
      </a>

      <nav class="desktop-nav" aria-label="Main Navigation">
        <a href="/" class="nav-link {% if active_nav == 'book' %}active{% endif %}">Mag-Book 🛵</a>
        <a href="/rider" class="nav-link {% if active_nav == 'rider' %}active{% endif %}">Rider Dispatch 📱</a>
        <a href="/admin" class="nav-link {% if active_nav == 'admin' %}active{% endif %}">Club Admin ⚙️</a>
      </nav>

      <div class="header-actions">
        <button type="button" id="install-app-btn" class="btn btn-install" title="I-install sa Cellphone">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"/>
            <path d="m7 10 5 5 5-5"/>
            <path d="M5 21h14"/>
          </svg>
          <span>Install App</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Mobile Navigation">
    <a href="/" class="bottom-nav-item {% if active_nav == 'book' %}active{% endif %}">
      <span class="bottom-nav-icon">🛵</span>
      <span>Mag-Book</span>
    </a>
    <a href="/rider" class="bottom-nav-item {% if active_nav == 'rider' %}active{% endif %}">
      <span class="bottom-nav-icon">📱</span>
      <span>Rider Hub</span>
    </a>
    <a href="/admin" class="bottom-nav-item {% if active_nav == 'admin' %}active{% endif %}">
      <span class="bottom-nav-icon">⚙️</span>
      <span>Admin</span>
    </a>
  </nav>

  <!-- Audio Dispatch Chime Generator (Web Audio API) -->
  <script>
    // Play an attention-grabbing dispatch chime for riders without external mp3 dependency
    window.playDispatchChime = function() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        // Beep 1
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(587.33, now); // D5
        osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.25);

        // Beep 2 (higher tone)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(880, now + 0.28); // A5
        osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.45); // D6
        gain2.gain.setValueAtTime(0.35, now + 0.28);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.28);
        osc2.stop(now + 0.6);
      } catch (e) {
        console.warn("Audio chime prevented by autoplay policy:", e);
      }
    };
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(console.error);
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById("install-app-btn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.classList.add("visible");
    });

    if (installBtn) {
      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === "accepted") {
          installBtn.classList.remove("visible");
        }
        deferredPrompt = null;
      });
    }
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
